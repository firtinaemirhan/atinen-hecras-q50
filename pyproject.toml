[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q50depth"
version = "1.0.0"
description = "Maximum water depth GeoTIFF for a return-period scenario of a HEC-RAS project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26",
    "rasterio>=1.3",
]

[project.optional-dependencies]
# Windows delivery environment: adds the library that drives HEC-RAS.
windows = ["ras-commander>=0.99"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
q50depth = "q50depth.cli:main"

[tool.setuptools]
packages = ["q50depth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::PendingDeprecationWarning"]
